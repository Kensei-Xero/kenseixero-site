<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kensei_xero</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e0e12;
      --panel: #17171d;
      --text: #e8e8ec;
      --accent: #9147ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 64px;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    header h1 {
      margin: 0 0 4px;
      font-size: 2rem;
      letter-spacing: 0.02em;
    }
    header p {
      margin: 0;
      color: #a0a0ab;
    }
    .player-wrap {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: var(--panel);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    .player-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .links {
      display: flex;
      gap: 16px;
      margin-top: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .links a {
      color: var(--text);
      background: var(--panel);
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.15s ease;
    }
    .links a:hover {
      background: var(--accent);
    }
    footer {
      margin-top: 48px;
      color: #55555f;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>kensei_xero</h1>
    <p>Live on Twitch — more coming to this site soon.</p>
  </header>

  <div class="player-wrap">
    <iframe
      src="https://player.twitch.tv/?channel=kensei_xero&parent=kenseixero.com&parent=www.kenseixero.com"
      allowfullscreen>
    </iframe>
  </div>

  <div class="links">
    <a href="https://twitch.tv/kensei_xero" target="_blank" rel="noopener">Twitch</a>
  </div>

  <footer>&copy; kenseixero.com</footer>
</body>
</html>
